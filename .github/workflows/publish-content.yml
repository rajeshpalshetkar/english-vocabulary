name: Validate and publish Blogger content

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "Legacy Blogger API publisher; use only if you still want a Blogger post"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate content catalogue
        run: python scripts/check_plan.py
      - name: Validate article
        run: python scripts/validate_article.py "${{ inputs.article_path }}"
      - name: Stop before Blogger publishing
        run: echo "Legacy Blogger publishing is disabled in the JSON-first static portal architecture."
