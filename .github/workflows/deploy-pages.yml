name: Build and deploy English Fluency Guide

on:
  push:
    branches: [main]
    paths:
      - "content/data/**"
      - "content/lessons/**"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/common.py"
      - "engine/config.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install Markdown==3.10 bleach==6.3.0
      - name: Build SEO pages from JSON
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
